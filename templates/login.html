<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 私人账本</title><link rel="stylesheet" href="/assets/style.css"></head><body class="login-page"><main class="login"><h1>私人账本</h1><p>登录后查看账目。文件仅在本实例处理。</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="password">本实例密码</label><input id="password" name="password" type="password" required autocomplete="current-password" autofocus><button class="primary" type="submit">登录账本</button>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}</form><p class="muted">首次使用：在服务器终端执行 <code>python app.py init</code> 设置自己的密码。</p></main></body></html>
